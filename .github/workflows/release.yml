name: Release

# Push a tag like v1.2.3 and this builds, tests and signs the app, then publishes a GitHub Release with the APK.
#   git tag v1.2.3 && git push origin v1.2.3
# Run it by hand (Actions > Release > Run workflow) to test the build without publishing anything.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without publishing (e.g. 1.2.3)"
        required: true
        default: "0.0.0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          if [ "$IS_TAG" = "true" ]; then version="${GITHUB_REF_NAME#v}"; else version="${{ inputs.version }}"; fi
          if ! [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a semantic version (1.2.3 or 1.2.3-rc.1)"; exit 1
          fi
          # 1.2.3 -> 10203: monotonic as long as minor and patch stay below 100.
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([ -n "${BASH_REMATCH[4]}" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$IS_TAG" = "true" ]; then
              echo "::error::Add the signing secrets (see README > Releases). A release signed with a throw-away key could never be updated."; exit 1
            fi
            echo "::warning::No signing key: this dry run is signed with a throw-away debug key."
            echo "signed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "FLUTE_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "FLUTE_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "FLUTE_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "FLUTE_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK
        # The runner image ships the SDK; make sure the platform and build tools we need are there and licensed.
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/jira-auth-proxy/package-lock.json

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Jira proxy tests
        working-directory: backend/jira-auth-proxy
        run: npm ci && npm test

      - name: Build the release APK
        run: >
          ./gradlew --no-daemon assembleRelease
          -PfluteVersionName=${{ steps.version.outputs.name }}
          -PfluteVersionCode=${{ steps.version.outputs.code }}

      - name: Collect the files
        id: files
        run: |
          mkdir -p dist
          apk="dist/flute-island-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          # The R8 mapping turns a minified crash report back into readable code; keep it with the release.
          cp app/build/outputs/mapping/release/mapping.txt "dist/flute-island-${{ steps.version.outputs.name }}-mapping.txt"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$apk" | head -3
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: flute-island-${{ steps.version.outputs.name }}
          path: dist/
          if-no-files-found: error

      - name: Publish the GitHub Release
        if: env.IS_TAG == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease }}
          body: |
            Sideload `flute-island-${{ steps.version.outputs.name }}.apk`, then follow *Setup* in the README
            (Android 13+: App info > ⋮ > Allow restricted settings before turning on the accessibility service).
            Check the file against `SHA256SUMS.txt`.
